name: APK Android

# Gera o instalador (.apk) do app a cada mudança em app/ e quando acionado à mão.
on:
  push:
    paths: ['app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
      - name: Compilar APK
        working-directory: app/android
        # Só arm64 (quase todos os celulares atuais): o build fica bem mais rápido
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: cesta-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publicar na página de Releases (para baixar direto no celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Cesta.apk
          gh release delete apk-teste --yes --cleanup-tag || true
          gh release create apk-teste Cesta.apk --prerelease --target "$GITHUB_SHA" \
            --title "Cesta para Android (versão de teste)" \
            --notes "APK gerado automaticamente a partir do branch ${GITHUB_REF_NAME} (commit ${GITHUB_SHA::7}). Baixe o Cesta.apk no celular Android e abra para instalar."
